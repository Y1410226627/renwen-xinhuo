# 词律探微引擎 · 反向代理配置（nginx）
#
# 用途：主从式部署——对外只有一个入口，主应用走 `/`，本引擎走 `/engine/`。
# 放置：/etc/nginx/conf.d/cilv.conf（或并入站点配置的 server{} 块内）
#
# ⚠ 关键点（三个都别改错）：
#   1) `proxy_pass http://127.0.0.1:8010/;` **末尾的 `/`** —— 它让 nginx 把 `/engine/`
#      前缀**剥掉**后再转发（引擎收到的路径是 `/api/...`）。
#      少了这个 `/` → 引擎会收到 `/engine/api/...` → 全部 404。
#   2) `proxy_buffering off;` —— 问答页有 **SSE 流式**（`/api/ask_stream`），
#      开着缓冲会导致「首字迟迟不出、看起来卡死」。
#   3) `proxy_read_timeout` 要够长 —— 深度问答可能等 60 秒以上。

# 引擎上游（只绑回环，不直接对外）
upstream cilv_engine {
    server 127.0.0.1:8010;
    keepalive 8;
}

server {
    listen 80;
    server_name _;                      # 换成你的域名 / 内网 IP

    # 上传体积上限（与引擎一致：写接口 1 MB）
    client_max_body_size 2m;

    # ---------- 本引擎：/engine/ → 127.0.0.1:8010/ ----------
    location /engine/ {
        proxy_pass http://cilv_engine/;              # ★ 末尾的 / 不能省（剥前缀）
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 流式：必须关缓冲，否则「边生成边显示」失效
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # ---------- 主应用：/ → 你的主应用 ----------
    location / {
        proxy_pass http://127.0.0.1:8000/;           # 换成主应用实际端口
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 180s;
    }

    # ---------- 可选：本引擎的静态页直出（减轻引擎进程负担） ----------
    # 若希望 /engine/parse.html 这类页面由 nginx 直接返回（不经引擎），可打开下面这段；
    # 路径按实际项目位置改。
    #
    # location ~ ^/engine/(index|parse|browse|graph|review|cipu|research)\.html$ {
    #     root /opt/cilvtanwei/项目代码/词律探微/data/vue;
    #     try_files /$1.html =404;
    # }
    # location /engine/assets/ {
    #     alias /opt/cilvtanwei/项目代码/词律探微/data/vue/assets/;
    # }
}
